name: Gerar cobrinha de contribuicoes

on:
  # 00:00 e 12:00 UTC. O antigo "* */12 * * *" disparava a cada MINUTO
  # durante duas horas do dia (~120 execucoes/dia).
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# Sem isso o GITHUB_TOKEN entra como somente-leitura em repositorios
# criados/reconfigurados depois de 2023 e o push para a branch output falha.
permissions:
  contents: write

jobs:
  gerar:
    name: Gerar e publicar SVG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v3 e a versao atual. A antiga "@master" nao consegue mais ler o grafico
      # de contribuicoes e gerava um SVG vazio de 1.4 KB (so o corpo da cobra).
      - name: Gerar SVG (tema claro + escuro)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark&color_snake=#39d353

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
